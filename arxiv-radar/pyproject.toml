[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-radar"
version = "0.1.0"
description = "Weekly frontier digest for arXiv. Cluster by theme, surface emerging vs receding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luca Cosentino" }]
dependencies = [
    "openai>=1.40",
    "click>=8.1",
    "rich>=13.7",
    "feedparser>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.scripts]
arxiv-radar = "arxiv_radar.cli:main"

[tool.setuptools.packages.find]
include = ["arxiv_radar*"]
