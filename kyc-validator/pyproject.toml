[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-validator"
version = "0.1.0"
description = "Local-only KYC document validator. PII never leaves the machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luca Cosentino" }]
dependencies = [
    "openai>=1.40",
    "click>=8.1",
    "rich>=13.7",
    "python-stdnum>=1.20",
    "rapidfuzz>=3.5",
]

[project.scripts]
kyc-validator = "kyc_validator.cli:main"

[tool.setuptools.packages.find]
include = ["kyc_validator*"]
